# wrangler.toml
# NOTE: Secrets (Stripe keys, Firebase keys, Supabase keys) must be set via:
#   wrangler secret put SECRET_NAME
# or in the Cloudflare dashboard under Workers > Settings > Variables & Secrets.
# NEVER commit secrets to this file.

name = "aisurfer2"
main = "server.ts"
compatibility_date = "2024-03-01"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# ─────────────────────────────────────────────────────────────────────────────
# Non-secret public config vars (safe to commit)
# ─────────────────────────────────────────────────────────────────────────────
[vars]
VITE_FIREBASE_AUTH_DOMAIN = "otd-ai-surfer.firebaseapp.com"
VITE_FIREBASE_PROJECT_ID = "otd-ai-surfer"
VITE_FIREBASE_STORAGE_BUCKET = "otd-ai-surfer.firebasestorage.app"
VITE_FIREBASE_MESSAGING_SENDER_ID = "46473040430"
VITE_SUPABASE_URL = "https://cctobgbyxjfabksnokbe.supabase.co"

# ─────────────────────────────────────────────────────────────────────────────
# SECRETS — set these via CLI, never in this file:
#
#   wrangler secret put VITE_FIREBASE_API_KEY
#   wrangler secret put VITE_FIREBASE_APP_ID
#   wrangler secret put VITE_SUPABASE_ANON_KEY
#   wrangler secret put VITE_GOOGLE_API_KEY
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put STRIPE_WEBHOOK_SECRET
#   wrangler secret put ADMIN_SECRET
#   wrangler secret put STRIPE_PRICE_ID_DAWN_PATROL
#   wrangler secret put STRIPE_PRICE_ID_BREAKLINE
#   wrangler secret put STRIPE_PRICE_ID_HATTERAS_ISLAND
#   wrangler secret put STRIPE_PRICE_ID_CAPE_POINT
# ─────────────────────────────────────────────────────────────────────────────
